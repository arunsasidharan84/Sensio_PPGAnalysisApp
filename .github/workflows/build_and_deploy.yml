name: Multi-Platform Build & Deploy

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      deploy_firebase:
        description: 'Deploy Android build to Firebase App Distribution'
        type: boolean
        default: true
      deploy_testflight:
        description: 'Deploy iOS build to TestFlight'
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  actions: write

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # 1. macOS Desktop Build
  # ──────────────────────────────────────────────────────────────────────────
  build-macos:
    name: macOS Desktop
    runs-on: macos-15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Build Rust universal engine
        run: |
          cd rust
          cargo build --release --target aarch64-apple-darwin
          cargo build --release --target x86_64-apple-darwin
          mkdir -p ../macos/Frameworks ../bin
          lipo -create \
            target/aarch64-apple-darwin/release/libsensio_ppg_core.dylib \
            target/x86_64-apple-darwin/release/libsensio_ppg_core.dylib \
            -output ../macos/Frameworks/libsensio_ppg_core.dylib
          cp ../macos/Frameworks/libsensio_ppg_core.dylib ../bin/libsensio_ppg_core.dylib
          cd ..

      - name: Set up Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Analyze Dart code
        run: flutter analyze --no-fatal-infos

      - name: Run Flutter unit tests
        run: flutter test

      - name: Build Flutter macOS app
        run: flutter build macos --release

      - name: Embed native library & codesign macOS app bundle
        run: |
          APP="build/macos/Build/Products/Release/sensio_ppg_app.app"
          mkdir -p "$APP/Contents/Frameworks"
          cp macos/Frameworks/libsensio_ppg_core.dylib "$APP/Contents/Frameworks/libsensio_ppg_core.dylib"
          codesign --force --sign - "$APP/Contents/Frameworks/libsensio_ppg_core.dylib"
          codesign --force --deep --sign - --entitlements macos/Runner/Release.entitlements "$APP"

      - name: Package macOS app as ZIP
        run: |
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent \
            build/macos/Build/Products/Release/sensio_ppg_app.app \
            dist/SensioPPGStudio-macOS.zip

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: SensioPPGStudio-macOS
          path: dist/SensioPPGStudio-macOS.zip
          retention-days: 14

  # ──────────────────────────────────────────────────────────────────────────
  # 2. Windows Desktop Build
  # ──────────────────────────────────────────────────────────────────────────
  build-windows:
    name: Windows Desktop
    runs-on: windows-2022
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Build Rust engine (Windows DLL)
        run: |
          cd rust
          cargo build --release
          cd ..
        shell: bash

      - name: Set up Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Build Flutter Windows app
        run: flutter build windows --release

      - name: Package Windows app with native DLL
        run: |
          mkdir -p dist
          cp rust/target/release/sensio_ppg_core.dll build/windows/x64/runner/Release/
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath dist/SensioPPGStudio-Windows.zip
        shell: pwsh

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: SensioPPGStudio-Windows
          path: dist/SensioPPGStudio-Windows.zip
          retention-days: 14

  # ──────────────────────────────────────────────────────────────────────────
  # 3. Android Build & Firebase App Distribution
  # ──────────────────────────────────────────────────────────────────────────
  build-android:
    name: Android APK & AppBundle
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Build native Android libraries
        run: |
          mkdir -p android/app/src/main/jniLibs
          cd rust
          cargo ndk -t arm64-v8a -t armeabi-v7a -t x86_64 -o ../android/app/src/main/jniLibs build --release
          cd ..

      - name: Set up Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Build Android Release APK
        run: flutter build apk --release

      - name: Build Android Release AppBundle
        run: flutter build appbundle --release

      - name: Upload Android APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SensioPPGStudio-Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14

      - name: Upload Android AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: SensioPPGStudio-Android-AAB
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 14

      - name: Deploy to Firebase App Distribution
        if: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.deploy_firebase == 'true') || startsWith(github.ref, 'refs/tags/v') }}
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID_ANDROID || '1:625498974111:android:0404b3c6e15ce5afc47faa' }}
        run: |
          if [ -n "$FIREBASE_TOKEN" ]; then
            npx firebase-tools appdistribution:distribute build/app/outputs/flutter-apk/app-release.apk \
              --project ccs-ppg-studio \
              --app "$FIREBASE_APP_ID" \
              --token "$FIREBASE_TOKEN" \
              --release-notes "Automated GitHub Actions build: $(git log -1 --pretty=%B)"
          else
            echo "FIREBASE_TOKEN secret not set in GitHub repository; skipping upload."
          fi

  # ──────────────────────────────────────────────────────────────────────────
  # 4. iOS Build & TestFlight Deployment
  # ──────────────────────────────────────────────────────────────────────────
  build-ios:
    name: iOS Build & TestFlight
    runs-on: macos-15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Build Rust static library for iOS
        run: |
          cd rust
          cargo build --release --target aarch64-apple-ios
          mkdir -p ../ios/Frameworks
          cp target/aarch64-apple-ios/release/libsensio_ppg_core.a ../ios/Frameworks/libsensio_ppg_core.a
          cd ..

      - name: Set up Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Build iOS app (unsigned archive)
        run: flutter build ios --release --no-codesign

      - name: Package iOS Build
        run: |
          mkdir -p dist
          cd build/ios/iphoneos
          zip -r ../../../dist/SensioPPGStudio-iOS.zip .
          cd ../../..

      - name: Upload iOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: SensioPPGStudio-iOS
          path: dist/SensioPPGStudio-iOS.zip
          retention-days: 14

      - name: Deploy to TestFlight
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.deploy_testflight == 'true' }}
        env:
          APP_STORE_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_ISSUER: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY_BASE64 }}
        run: |
          if [ -n "$APP_STORE_KEY_ID" ] && [ -n "$APP_STORE_KEY_BASE64" ]; then
            mkdir -p ~/.appstoreconnect/private_keys
            echo "$APP_STORE_KEY_BASE64" | base64 --decode > ~/.appstoreconnect/private_keys/AuthKey_${APP_STORE_KEY_ID}.p8
            flutter build ipa --release
            xcrun altool --upload-app --type ios \
              --file build/ios/ipa/*.ipa \
              --apiKey "$APP_STORE_KEY_ID" \
              --apiIssuer "$APP_STORE_ISSUER"
          else
            echo "App Store Connect credentials not configured in secrets; skipping TestFlight upload."
          fi

  # ──────────────────────────────────────────────────────────────────────────
  # 5. GitHub Release (Triggered on version tags v*)
  # ──────────────────────────────────────────────────────────────────────────
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build-macos, build-windows, build-android, build-ios]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release_artifacts

      - name: Create GitHub Release
        uses: ncipollo/release-action@v1
        with:
          artifacts: "release_artifacts/**/*"
          allowUpdates: true
          replacesArtifacts: true
          draft: false
          prerelease: false
          generateReleaseNotes: true
