[package]
name = "sensio_ppg_core"
version = "1.0.0"
edition = "2021"
description = "High-performance native PPG conditioning, SQI, APG morphology, and HRV engine"

[lib]
name = "sensio_ppg_core"
crate-type = ["cdylib", "staticlib", "rlib"]

[[bin]]
name = "sensio_ppg_engine"
path = "src/bin/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rustfft = "6.2"
num-complex = "0.4"
rayon = "1.10"
nalgebra = "0.33"
csv = "1.3"
chrono = "0.4"

[dev-dependencies]
approx = "0.5"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
